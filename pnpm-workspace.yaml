packages:
  - packages/*
  - packages/*/test-app
  - playgrounds/*
  - tests/app

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - lmdb
  - msgpackr-extract

overrides:
  cookie: '>=0.7.0'
