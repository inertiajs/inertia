packages:
  - packages/*
  - packages/*/test-app
  - playgrounds/*
  - tests/app

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

overrides:
  cookie: '>=0.7.0'
  '@tailwindcss/typography>postcss-selector-parser': '^7.1.6'

auditConfig:
  ignoreGhsas:
    # braces: disputed upstream with no fix planned, only reachable through dev tooling (es-check, nodemon)
    - GHSA-vfj7-8cjw-p6xm
    # deepmerge: no patched release exists yet, only reachable through dev tooling (@sveltejs/vite-plugin-svelte)
    - GHSA-gcqx-w48m-w2h4
