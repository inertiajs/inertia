name: Publish Packages

on:
  release:
    types: [released, prereleased]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        adapter: ['core', 'vue3', 'react', 'svelte']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 'Build ${{ matrix.adapter }}'
        run: pnpm -r --filter ./packages/core --filter ./packages/${{ matrix.adapter }} build

      - name: 'Publish ${{ matrix.adapter }} to npm'
        run: cd "./packages/${{ matrix.adapter }}" && pnpm publish --no-git-checks --tag legacy
