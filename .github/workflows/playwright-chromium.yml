name: Playwright Tests on Chromium
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-chromium:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Chromium (${{ matrix.adapter }}${{ matrix.http == 'axios' && ', axios' || '' }}${{ matrix.svelte-async == 'true' && ', async' || '' }})
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        adapter: ['vue', 'react', 'svelte']
        http: ['default', 'axios']
        svelte-async: ['false', 'true']
        exclude:
          - adapter: 'vue'
            svelte-async: 'true'
          - adapter: 'react'
            svelte-async: 'true'
          - adapter: 'svelte'
            http: 'axios'
            svelte-async: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Inertia
        run: pnpm -r --filter './packages/{core,vite}' --filter './packages/${{ matrix.adapter }}*' build

      - name: Run Playwright Tests
        run: pnpm test:${{ matrix.adapter }}
        env:
          VITE_HTTP_CLIENT: ${{ matrix.http }}
          SVELTE_ASYNC: ${{ matrix.svelte-async }}

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-screenshots-${{ matrix.adapter }}-chromium-${{ matrix.http }}${{ matrix.svelte-async == 'true' && '-async' || '' }}
          path: test-results

  test-chromium-ssr:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Chromium SSR (${{ matrix.adapter }}, Node ${{ matrix.node-version }}${{ matrix.svelte-async == 'true' && ', async' || '' }})
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        adapter: ['vue', 'react', 'svelte']
        node-version: ['22.x', '24.x', 'latest']
        svelte-async: ['false', 'true']
        exclude:
          - adapter: 'vue'
            svelte-async: 'true'
          - adapter: 'react'
            svelte-async: 'true'
          - adapter: 'svelte'
            node-version: '22.x'
            svelte-async: 'true'
          - adapter: 'svelte'
            node-version: 'latest'
            svelte-async: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Inertia
        run: pnpm -r --filter './packages/{core,vite}' --filter './packages/${{ matrix.adapter }}*' build

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps chromium

      - name: Run Playwright SSR Tests
        run: pnpm test:ssr:${{ matrix.adapter }} --project=chromium
        env:
          SVELTE_ASYNC: ${{ matrix.svelte-async }}

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-screenshots-${{ matrix.adapter }}-chromium-ssr-node-${{ matrix.node-version }}${{ matrix.svelte-async == 'true' && '-async' || '' }}
          path: test-results
