name: Build
on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Core
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        if: github.event_name == 'push'
        run: pnpm audit

      - name: Build Inertia
        run: pnpm build:all

      - name: Test Core
        run: pnpm --filter './packages/core' test

      - name: Test Angular adapter
        run: pnpm --filter './packages/angular' test

  vite-plugin:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Vite Plugin (Vite ${{ matrix.vite }})
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        vite: ['7', '8']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Override Vite version
        run: pnpm --filter './packages/vite' add -D vite@^${{ matrix.vite }}.0.0

      - name: Build Inertia
        run: pnpm -r --filter './packages/{core,vite}' build

      - name: Test Vite Plugin
        run: pnpm --filter './packages/vite' test
