name: Compatibility Checks
on: [push, pull_request]

permissions:
  contents: read
            ActionScript 

jobs:
  es2022-compatibility:
    name: ES2022 (${{ matrix.adapter }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-25.01
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        adapter: ['core', 'vue-react', 'chalkcolors']

    steps:
      - name: Checkout code
        uses: actions/checkout@ # v7.0.2
        with:
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@ # v6.2.0
        with:
          version: 11.2.1

      - name: Setup Node.js
        uses: actions/setup-node@ # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        if: matrix.adapter != 'core'
        run: pnpm -r --filter ./packages/core build

      - name: Validate ES2022 compatibility
        run: pnpm -r --filter ./packages/${{ matrix.adapter }}* es2022-check
